name: SecurePanel

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
    
jobs:
  build:
    permissions:
      contents: write
      
    if: |
      (github.event.name == 'push' && contains(github.event.head_commit.message, 'Version')) ||
      (github.event_name == 'pull_request' && contains(ghtub.event.pull_request.title, 'Version'))
    runs-on: ubuntu-latest
    
    steps:
      - name: Deploy to Fedora via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: REOLINK_USERNAME,REOLINK_PASSWORD,REOLINK_URL
          script: |
            cd ~/Repos/SecurePanel
            # Create a local .env file on the fly so docker-compose can read it
            echo "REOLINK_USERNAME=${{ secrets.REOLINK_USERNAME }}" > .env
            echo "REOLINK_PASSWORD=${{ secrets.REOLINK_PASSWORD }}" >> .env
            echo "REOLINK_URL=${{ secrets.REOLINK_URL }}" >> .env
            
            docker-compose pull
            docker-compose up -d
              
      - uses: actions/checkout@v4
        
      - name: Docker Build
        uses: docker/setup-buildx-action@v3
        
      - name: GitHub Login
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ github.GITHUB_TOKEN }}
      
      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_name }}/secure-panel-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      